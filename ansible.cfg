[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
# YAML-formatted output. This used to be `stdout_callback = yaml`, which came
# from community.general and was removed in that collection's v12 — a fresh
# install pulls the current collection, so use the core option instead.
stdout_callback = default
callback_result_format = yaml
nocows = True
interpreter_python = auto_silent
