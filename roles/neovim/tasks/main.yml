---
- name: Check whether Neovim is installed
  ansible.builtin.stat:
    path: /opt/nvim/AppRun
  register: nvim_installed

- name: Install Neovim from AppImage
  when: not nvim_installed.stat.exists
  block:
    - name: Download Neovim AppImage
      ansible.builtin.get_url:
        url: "{{ neovim_appimage_url }}"
        dest: /tmp/nvim.appimage
        mode: "0755"

    - name: Extract the AppImage
      ansible.builtin.command: /tmp/nvim.appimage --appimage-extract
      args:
        chdir: /tmp

    - name: Remove any stale Neovim install
      become: true
      ansible.builtin.file:
        path: /opt/nvim
        state: absent

    - name: Move Neovim into /opt
      become: true
      ansible.builtin.command: mv /tmp/squashfs-root /opt/nvim
      args:
        creates: /opt/nvim/AppRun

    - name: Symlink nvim into PATH
      become: true
      ansible.builtin.file:
        src: /opt/nvim/AppRun
        dest: /usr/local/bin/nvim
        state: link
        force: true

    - name: Remove the downloaded AppImage
      ansible.builtin.file:
        path: /tmp/nvim.appimage
        state: absent

# Neovim's Python provider, isolated in a uv-managed venv. init.lua points
# python3_host_prog at this venv when it exists.
- name: Create the Neovim Python provider venv
  ansible.builtin.command: uv venv {{ ansible_env.HOME }}/.local/share/nvim/venv
  args:
    creates: "{{ ansible_env.HOME }}/.local/share/nvim/venv/bin/python3"
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"

- name: Install Python provider packages into the venv
  ansible.builtin.command: >
    uv pip install --python {{ ansible_env.HOME }}/.local/share/nvim/venv/bin/python3
    {{ neovim_provider_packages | join(' ') }}
  environment:
    PATH: "{{ ansible_env.HOME }}/.local/bin:{{ ansible_env.PATH }}"
  register: nvim_provider
  changed_when: "'Installed' in (nvim_provider.stderr | default(''))"
