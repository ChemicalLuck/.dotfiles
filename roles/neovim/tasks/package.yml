---
# Neovim from the distro's own repositories. Used where the upstream AppImage
# won't run (musl distros such as Alpine).
- name: Fail early when Neovim package names are unknown for this distro
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in neovim_packages_by_family
    fail_msg: >-
      No neovim_packages_by_family entry for '{{ ansible_facts['os_family'] }}'.
      Add one to group_vars/all.yml, or set neovim_install_method: appimage.
    quiet: true

- name: Install Neovim
  become: true
  ansible.builtin.package:
    name: "{{ neovim_packages_by_family[ansible_facts['os_family']] }}"
    state: present

# An AppImage install from a previous run would shadow the packaged nvim on
# PATH, so clear it out when switching methods.
- name: Check for a leftover AppImage install
  ansible.builtin.stat:
    path: /opt/nvim/AppRun
  register: nvim_appimage

- name: Remove the leftover AppImage install
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/nvim
    - /opt/nvim
  when: nvim_appimage.stat.exists
