---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
      - ca-certificates
      - curl
      - gnupg
      - apt-transport-https
    state: present

- name: Add deadsnakes PPA (Python 3.12)
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present

- name: Install GitHub CLI keyring
  become: true
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: deb_arch
  changed_when: false

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ deb_arch.stdout }}
      signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true

- name: Install WSL audio packages
  become: true
  ansible.builtin.apt:
    name: "{{ wsl_apt_packages }}"
    state: present
  when: "'microsoft' in ansible_kernel | lower"

- name: Upgrade all apt packages
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: apt_upgrade | bool
