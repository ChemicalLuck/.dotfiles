---
# Per-family prep: refresh the package cache, enable extra repositories and
# apply any system upgrade. Everything after this is distro-neutral.
- name: Prepare the package manager
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/tasks"

- name: Install system packages
  become: true
  ansible.builtin.package:
    name: "{{ system_packages }}"
    state: present

- name: Install WSL audio packages
  become: true
  ansible.builtin.package:
    name: "{{ wsl_packages_by_family[ansible_facts['os_family']] }}"
    state: present
  when:
    - "'microsoft' in ansible_facts['kernel'] | lower"
    - ansible_facts['os_family'] in wsl_packages_by_family
