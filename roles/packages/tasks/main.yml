---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install repository prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
      - ca-certificates
      - curl
      - gnupg
      - apt-transport-https
    state: present

- name: Remove legacy deadsnakes PPA source (key in trusted.gpg)
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ppa_deadsnakes_ppa_noble.list
    state: absent

- name: Install deadsnakes PPA keyring
  become: true
  ansible.builtin.get_url:
    url: >-
      https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0xF23C5A6CF475977595C89F51BA6932366A755776
    dest: /etc/apt/keyrings/deadsnakes.asc
    mode: "0644"

- name: Add deadsnakes PPA (Python 3.12)
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/deadsnakes.asc]
      http://ppa.launchpad.net/deadsnakes/ppa/ubuntu
      {{ ansible_distribution_release }} main
    filename: deadsnakes
    state: present

- name: Install GitHub CLI keyring
  become: true
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: deb_arch
  changed_when: false

- name: Remove stale GitHub CLI source entries (wrong keyring path)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/github-cli.list
    regexp: '/etc/apt/keyrings/githubcli-archive-keyring\.gpg'
    state: absent
  failed_when: false

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ deb_arch.stdout }}
      signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present

- name: Install HashiCorp keyring
  become: true
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"

- name: Remove stale manual HashiCorp source (unmanaged keyring path)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/hashicorp.list
    regexp: 'hashicorp-archive-keyring\.gpg'
    state: absent
  failed_when: false

- name: Add HashiCorp apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ deb_arch.stdout }}
      signed-by=/etc/apt/keyrings/hashicorp.asc]
      https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main
    filename: hashicorp
    state: present

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: true

- name: Install WSL audio packages
  become: true
  ansible.builtin.apt:
    name: "{{ wsl_apt_packages }}"
    state: present
  when: "'microsoft' in ansible_kernel | lower"

- name: Upgrade all apt packages
  become: true
  ansible.builtin.apt:
    upgrade: dist
  when: apt_upgrade | bool
