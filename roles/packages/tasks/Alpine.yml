---
# Most of the tooling below (stow, fzf, github-cli, neovim, docker, aws-cli,
# luarocks, keychain) lives in Alpine's community repository, which is not
# always enabled. Turn it on if it isn't.
#
# This runs before `bash` is installed, so it has to be POSIX sh that busybox
# can execute — no bashisms, no GNU-only sed/grep flags.
- name: Ensure the Alpine community repository is enabled
  become: true
  ansible.builtin.shell: |
    repos=/etc/apk/repositories
    changed=0

    # Uncomment an existing, commented-out community line.
    if grep -qE '^#[[:space:]]*[^[:space:]]+/community[[:space:]]*$' "$repos"; then
      sed -i -r 's|^#[[:space:]]*([^[:space:]]+/community)[[:space:]]*$|\1|' "$repos"
      changed=1
    fi

    # No community line at all: derive one from the main line's mirror.
    if ! grep -qE '^[^[:space:]#]+/community[[:space:]]*$' "$repos"; then
      main=$(grep -E '^[^[:space:]#]+/main[[:space:]]*$' "$repos" | head -n1)
      if [ -n "$main" ]; then
        printf '%s\n' "${main%/main}/community" >> "$repos"
        changed=1
      fi
    fi

    [ "$changed" -eq 1 ] && echo changed
    exit 0
  args:
    executable: /bin/sh
  register: apk_community
  changed_when: "'changed' in apk_community.stdout"

- name: Update the apk cache
  become: true
  community.general.apk:
    update_cache: true
  changed_when: false

- name: Upgrade all apk packages
  become: true
  community.general.apk:
    upgrade: true
  when: system_upgrade | bool
