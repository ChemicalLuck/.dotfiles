---
# nvm is a shell function, so these steps source it explicitly rather than
# relying on a module. The `creates` / changed_when guards keep them idempotent.
#
# nvm downloads Node's official prebuilt binaries, which are linked against
# glibc — see package.yml for the musl (Alpine) path.
- name: Install nvm
  ansible.builtin.shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env'].HOME }}/.nvm/nvm.sh"

- name: Install the latest Node via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install node
  args:
    executable: /bin/bash
  register: nvm_node
  changed_when: "'is already installed' not in nvm_node.stdout"
