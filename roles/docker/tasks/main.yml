---
- name: Fail early when Docker package names are unknown for this distro
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in docker_packages_by_family
    fail_msg: >-
      No docker_packages_by_family entry for '{{ ansible_facts['os_family'] }}'.
      Add one to group_vars/all.yml.
    quiet: true

# Debian/Ubuntu pull Docker Engine from Docker's own apt repo; every other
# family uses the distro's packages, which is what upstream recommends there.
- name: Set up the Docker package source
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/tasks"

- name: Install Docker Engine
  become: true
  ansible.builtin.package:
    name: "{{ docker_packages_by_family[ansible_facts['os_family']] }}"
    state: present

- name: Add user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true
  when: docker_add_user_to_group | bool

# `service` speaks systemd, OpenRC and friends; skip entirely where there's no
# init system to talk to (containers, WSL without systemd).
- name: Enable and start Docker
  become: true
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when:
    - docker_manage_service | bool
    - ansible_facts['service_mgr'] in ['systemd', 'openrc', 'sysvinit', 'launchd', 'runit']
