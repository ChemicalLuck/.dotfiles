---
# AWS CLI v2 from the distro's own repositories. Used where AWS's bundled
# installer won't run (musl distros such as Alpine).
- name: Fail early when AWS CLI package names are unknown for this distro
  ansible.builtin.assert:
    that:
      - ansible_os_family in awscli_packages_by_family
    fail_msg: >-
      No awscli_packages_by_family entry for '{{ ansible_os_family }}'.
      Add one to group_vars/all.yml, or set awscli_install_method: bundle.
    quiet: true

- name: Install AWS CLI v2
  become: true
  ansible.builtin.package:
    name: "{{ awscli_packages_by_family[ansible_os_family] }}"
    state: present
