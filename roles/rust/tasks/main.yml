---
- name: Install rustup
  ansible.builtin.shell: |
    set -o pipefail
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  args:
    executable: /bin/bash
    creates: "{{ ansible_facts['env'].HOME }}/.cargo/bin/rustup"

- name: Get current default toolchain
  ansible.builtin.command: "{{ ansible_facts['env'].HOME }}/.cargo/bin/rustup default"
  register: rustup_default
  changed_when: false
  failed_when: false

- name: Set nightly as the default toolchain
  ansible.builtin.command: "{{ ansible_facts['env'].HOME }}/.cargo/bin/rustup default nightly"
  when: "'nightly' not in rustup_default.stdout"

# Driven through cargo itself rather than community.general.cargo: distro
# packages of Ansible ship collections without MANIFEST.json, which makes
# ansible-galaxy skip the install ("already installed") and leaves you on
# whatever subset the distro shipped. Alpine's copy has no `cargo` module.
# `cargo install --list` is one command and no collection dependency.
- name: List already-installed cargo crates
  ansible.builtin.command: cargo install --list
  register: cargo_installed
  changed_when: false
  environment:
    PATH: "{{ ansible_facts['env'].HOME }}/.cargo/bin:{{ ansible_facts['env'].PATH }}"

# `cargo install --list` prints "<crate> v<version>:" followed by an indented
# line per binary, so the unindented lines are the crate names.
#
# --locked builds against the Cargo.lock the crate was published with, instead
# of re-resolving every transitive dependency to the newest semver-compatible
# release. Without it a broken upstream release breaks the install: eza 0.23.5
# depends on palette 0.7.5, which asks for palette_derive "0.7.5" — a caret
# requirement that also accepts 0.7.7, whose macros emit code for a crate
# layout 0.7.5 doesn't have, so the build dies with dozens of E0433s. eza's
# published lockfile pins palette_derive 0.7.6 and builds cleanly.
#
# Anything added to cargo_crates must therefore publish a Cargo.lock. Binary
# crates normally do; if one doesn't, cargo says so plainly rather than
# silently building something else.
- name: Install cargo crates
  ansible.builtin.command: cargo install --locked {{ item }}
  loop: "{{ cargo_crates }}"
  when: item not in (cargo_installed.stdout | regex_findall('^(\\S+) v[0-9]', multiline=True))
  environment:
    PATH: "{{ ansible_facts['env'].HOME }}/.cargo/bin:{{ ansible_facts['env'].PATH }}"
