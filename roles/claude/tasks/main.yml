---
# Claude Code CLI, installed with Anthropic's native installer. It drops a
# launcher at ~/.local/bin/claude pointing into ~/.local/share/claude/versions/
# and updates itself in the background, so Ansible only has to get it there
# once — hence `creates` rather than a version check.
#
# Every task here is bounded by async/poll. The installer is silent while it
# downloads and `claude install` renders a TUI, so anything that goes wrong
# under Ansible shows up as a task that never returns. A timeout turns that
# into a failure with a message.
- name: Install Claude Code runtime dependencies
  become: true
  ansible.builtin.package:
    name: "{{ claude_packages_by_family[ansible_facts['os_family']] }}"
    state: present
  when: ansible_facts['os_family'] in claude_packages_by_family

# `claude install`, `claude update` and `claude doctor` scan the shell rc files
# for a stale `claude` alias. Before v2.1.214 a *directory* at one of those
# paths made all three hang indefinitely with no output — which under Ansible
# looks like the playbook wedging on this role. Cheap to rule out up front.
- name: Stat the shell config paths the installer scans
  ansible.builtin.stat:
    path: "{{ ansible_facts['env'].HOME }}/{{ item }}"
  loop:
    - .bashrc
    - .zshrc
    - .profile
    - .config/fish/config.fish
  register: claude_shell_rc

- name: Fail when a directory sits at one of those paths
  vars:
    # `stat.isdir` is absent, not false, for a path that doesn't exist.
    claude_rc_dirs: >-
      {{ claude_shell_rc.results | selectattr('stat.isdir', 'defined')
         | selectattr('stat.isdir') | map(attribute='item') | list }}
  ansible.builtin.assert:
    that: claude_rc_dirs | length == 0
    fail_msg: >-
      A directory sits at {{ claude_rc_dirs | join(', ') }} under
      {{ ansible_facts['env'].HOME }}. Claude Code's installer scans those
      paths for a stale `claude` alias and hangs on a directory before
      v2.1.214. Move it aside and re-run.
    quiet: true

# The install moves the binary twice: install.sh downloads ~305MB into
# ~/.claude/downloads, then `claude install` pulls the same build again into
# ~/.local/share/claude/versions. A VM that's short on either RAM or disk
# doesn't fail cleanly — it thrashes or stalls, which is indistinguishable from
# a slow download until the timeout fires. Check before spending 15 minutes.
- name: Measure free space on the home filesystem
  ansible.builtin.command: df -Pk {{ ansible_facts['env'].HOME | quote }}
  register: claude_df
  changed_when: false

- name: Fail early when the VM is too small to install
  vars:
    claude_home_free_mb: "{{ (claude_df.stdout_lines[-1].split()[3] | int) // 1024 }}"
    claude_free_mb: "{{ ansible_facts['memory_mb']['nocache']['free'] }}"
  ansible.builtin.assert:
    that:
      # Both sides through `int`: an override passed with -e arrives as a string.
      - claude_home_free_mb | int >= claude_disk_required_mb | int
      - claude_free_mb | int >= claude_memory_required_mb | int
    fail_msg: >-
      Not enough headroom to install Claude Code:
      {{ claude_home_free_mb }}MB free on {{ ansible_facts['env'].HOME }}
      (need {{ claude_disk_required_mb }}MB) and
      {{ claude_free_mb }}MB free RAM (need {{ claude_memory_required_mb }}MB).
      The installer downloads a ~305MB binary twice and needs roughly 512MB of
      working memory; short of either it stalls rather than failing.
    quiet: true

- name: Install Claude Code
  ansible.builtin.shell:
    executable: /bin/bash
    creates: "{{ ansible_facts['env'].HOME }}/.local/bin/claude"
    # Close stdin explicitly: `claude install` should never be left waiting on
    # a terminal that Ansible is not going to provide.
    stdin: ""
    stdin_add_newline: false
    # Fetch the script, then run it under an inner `timeout`, rather than
    # piping curl straight into bash. Two reasons:
    #
    #  - `timeout -k` is what actually ends a stuck install. A plain `timeout`
    #    sends SIGTERM and then *waits* for the child, so a `claude install`
    #    that ignores SIGTERM hangs the timeout too; -k follows up with
    #    SIGKILL. Ansible's own async timeout stops waiting on the job but
    #    does not reliably kill it, which leaves the installer running after
    #    the play has moved on.
    #  - Separating the two steps distinguishes "couldn't fetch the script"
    #    from "the install itself stalled", which the pipe conflated.
    #
    # The inner bound is 60s short of the async one so it fires first and
    # reports, instead of the play failing on the outer timeout.
    cmd: |
      set -euo pipefail
      script=$(mktemp)
      trap 'rm -f "$script"' EXIT
      curl -fsSL https://claude.ai/install.sh -o "$script"
      timeout -k 30 {{ (claude_install_timeout | int) - 60 }} \
        bash "$script" {{ claude_channel }}
  environment: "{{ claude_env }}"
  async: "{{ claude_install_timeout }}"
  poll: 10

- name: Verify Claude Code runs
  ansible.builtin.command: claude --version
  register: claude_version
  changed_when: false
  environment: "{{ claude_env | combine({'PATH': ansible_facts['env'].HOME ~ '/.local/bin:' ~ ansible_facts['env'].PATH}) }}"
  async: "{{ claude_verify_timeout }}"
  poll: 5

- name: Report the installed version
  ansible.builtin.debug:
    msg: "{{ claude_version.stdout }}"
