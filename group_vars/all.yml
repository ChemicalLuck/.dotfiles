---
# Single source of truth for everything the playbook installs.
#
# Package NAMES differ between distros, so anything installed by the system
# package manager lives in a `*_by_family` map keyed by `ansible_facts['os_family']`
# ("Debian", "Alpine", "Archlinux", "RedHat", ...). To support a new distro,
# add a key to those maps — the roles themselves need no changes.
#
# Tested on Debian/Ubuntu and Alpine. The other families are best-effort
# starting points.

# Set true to upgrade every system package during provisioning.
system_upgrade: false

# ---------------------------------------------------------------------------
# System packages
# ---------------------------------------------------------------------------

# Names spelled identically on every supported family.
system_packages_common:
  - bash          # the dotfiles role's scripts need a real bash, not ash
  - clang
  - curl
  - fzf
  - git
  - gzip
  - keychain
  - lld
  - luarocks
  - make
  - stow
  - tar
  - tmux
  - unzip

# Family-specific names and extras, merged with the list above.
system_packages_by_family:
  Debian:
    - gcc
    - g++
    - apt-transport-https
    - ca-certificates
    - fd-find
    - gh              # from the GitHub CLI repo added by the packages role
    - terraform       # from the HashiCorp repo added by the packages role
    - python3-dev
    - python3-pip
    - python3-venv
  Alpine:
    # build-base pulls gcc, g++, musl-dev, binutils and make — cargo needs a
    # working C toolchain and linker to build the crates below.
    - build-base
    # busybox's find/readlink are too thin for the dotfiles role's symlink
    # cleanup; coreutils/findutils replace them with the GNU versions.
    - coreutils
    - findutils
    # busybox has no usermod/chsh, so the dotfiles role can't set the login
    # shell without shadow. Debian, Arch and RedHat ship usermod in their base
    # install (passwd / shadow-utils), so only Alpine needs it listed.
    - shadow
    - fd
    - github-cli
    - ca-certificates
    - python3
    - python3-dev
    - py3-pip
    # No terraform: HashiCorp publishes no musl build, and Alpine dropped the
    # package after the BUSL relicense. Add `opentofu` here if you want it.
  Archlinux:      # best-effort, untested
    - gcc
    - base-devel
    - fd
    - github-cli
    - python
    - python-pip
  RedHat:         # best-effort, untested
    - gcc
    - gcc-c++
    - ca-certificates
    - fd-find
    - python3-devel
    - python3-pip

# Resolved list handed to the package manager. The playbook asserts the running
# distro's family has an entry above before any role gets this far.
system_packages: >-
  {{ system_packages_common
     + (system_packages_by_family[ansible_facts['os_family']] | default([])) }}

# Ubuntu-only: the deadsnakes PPA and the Python it provides. Debian proper and
# every other distro use the system python3 from the lists above.
deadsnakes_enabled: "{{ ansible_facts['distribution'] == 'Ubuntu' }}"
deadsnakes_packages:
  - python3.12
  - python3.12-venv

# WSL-only packages. WSLg already provides the PulseAudio server
# (/mnt/wslg/PulseServer); these are the client tools that make audio (e.g.
# Claude Code voice via sox's play/rec) actually work.
wsl_packages_by_family:
  Debian:
    - sox
    - libsox-fmt-all
    - pulseaudio-utils
    - alsa-utils
    - ffmpeg
  Alpine:
    - sox
    - pulseaudio-utils
    - alsa-utils
    - ffmpeg

# ---------------------------------------------------------------------------
# Language toolchains
# ---------------------------------------------------------------------------

# Rust CLI tools installed with `cargo install`. Built from source, so these are
# distro-agnostic — they just need the C toolchain installed above.
cargo_crates:
  - eza
  - bat
  - ripgrep
  - zoxide
  - hyperfine

# Node: nvm ships glibc-only prebuilt binaries, so musl distros install the
# distro's own nodejs instead. Override to force either method.
node_install_method: "{{ 'package' if ansible_facts['os_family'] == 'Alpine' else 'nvm' }}"
node_packages_by_family:
  Debian: [nodejs, npm]
  Alpine: [nodejs, npm]
  Archlinux: [nodejs, npm]
  RedHat: [nodejs, npm]

# Global npm packages.
npm_globals:
  - tree-sitter-cli
  - neovim

# CLI applications installed with `uv tool install` (the pipx replacement).
# Only genuine command-line tools belong here. pynvim is a library, not a tool,
# so it lives in neovim_provider_packages below instead.
uv_tools: []

# ---------------------------------------------------------------------------
# Neovim
# ---------------------------------------------------------------------------

# The upstream AppImage is linked against glibc, so musl distros install the
# distro package instead. Override to force either method.
neovim_install_method: "{{ 'package' if ansible_facts['os_family'] == 'Alpine' else 'appimage' }}"
neovim_appimage_url: "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.appimage"
neovim_packages_by_family:
  Debian: [neovim]
  Alpine: [neovim]
  Archlinux: [neovim]
  RedHat: [neovim]

# Packages installed into Neovim's dedicated uv venv (its Python provider).
neovim_provider_packages:
  - pynvim

# Build the provider venv against the system interpreter rather than letting uv
# download its own — the downloaded builds are glibc-first.
neovim_provider_python: python3

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

# Docker Engine (not Docker Desktop). On Debian/Ubuntu it comes from Docker's
# official apt repo; elsewhere from the distro's own packages.
docker_packages_by_family:
  Debian:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  Alpine:
    - docker
    - docker-cli-buildx
    - docker-cli-compose
  Archlinux:
    - docker
    - docker-buildx
    - docker-compose
  RedHat:
    - docker
    - docker-compose

# Add the provisioning user to the docker group (takes effect on next login).
docker_add_user_to_group: true

# Enable and start the daemon. Skipped automatically when there's no init
# system to talk to (e.g. inside a container).
docker_manage_service: true

# ---------------------------------------------------------------------------
# AWS CLI
# ---------------------------------------------------------------------------

# AWS's official bundled installer is glibc-only, so musl distros use the distro
# package. Debian/Ubuntu can't: apt only ships the deprecated v1 (`awscli`).
awscli_install_method: "{{ 'package' if ansible_facts['os_family'] == 'Alpine' else 'bundle' }}"
awscli_installer_url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
awscli_packages_by_family:
  Alpine: [aws-cli]
  Archlinux: [aws-cli-v2]
  RedHat: [awscli2]

# ---------------------------------------------------------------------------
# Claude Code
# ---------------------------------------------------------------------------

# What the native installer should fetch: "latest", "stable", or a pinned
# version number such as "2.1.89".
claude_channel: latest

# Runtime dependencies the installer doesn't bring with it. bash and curl are
# already in system_packages_common; musl distros additionally need the C++
# runtime, plus a system ripgrep because the bundled one is glibc-linked.
claude_packages_by_family:
  Alpine:
    - libgcc
    - libstdc++
    - ripgrep

# ---------------------------------------------------------------------------
# Dotfiles
# ---------------------------------------------------------------------------

# Stow packages are NOT listed here — the dotfiles role stows every directory
# under stow/ automatically, and backs up any conflicting real files first.
